syntax = "proto3";

package streaming;

// ---------- mensagens ----------
message Usuario {
  int64 id = 1;
  string nome = 2;
  int32 idade = 3;
}

message Musica {
  int64 id = 1;
  string nome = 2;
  string artista = 3;
}

message Playlist {
  int64 id = 1;
  string nome = 2;
  int64 usuario_id = 3;
  repeated int64 musica_ids = 4;
}

message Id { int64 id = 1; }
message Vazio {}

message UsuarioRequest { string nome = 1; int32 idade = 2; }
message AtualizarUsuarioRequest { int64 id = 1; string nome = 2; int32 idade = 3; }

message MusicaRequest { string nome = 1; string artista = 2; }
message AtualizarMusicaRequest { int64 id = 1; string nome = 2; string artista = 3; }

message PlaylistRequest { string nome = 1; int64 usuario_id = 2; repeated int64 musica_ids = 3; }
message AtualizarPlaylistRequest { int64 id = 1; string nome = 2; int64 usuario_id = 3; repeated int64 musica_ids = 4; }

message ListaUsuarios { repeated Usuario usuarios = 1; }
message ListaMusicas { repeated Musica musicas = 1; }
message ListaPlaylists { repeated Playlist playlists = 1; }

// ---------- serviço ----------
service Streaming {
  rpc ListarUsuarios (Vazio) returns (ListaUsuarios);
  rpc BuscarUsuario (Id) returns (Usuario);
  rpc CriarUsuario (UsuarioRequest) returns (Usuario);
  rpc AtualizarUsuario (AtualizarUsuarioRequest) returns (Usuario);
  rpc ExcluirUsuario (Id) returns (Vazio);

  rpc ListarMusicas (Vazio) returns (ListaMusicas);
  rpc BuscarMusica (Id) returns (Musica);
  rpc CriarMusica (MusicaRequest) returns (Musica);
  rpc AtualizarMusica (AtualizarMusicaRequest) returns (Musica);
  rpc ExcluirMusica (Id) returns (Vazio);

  rpc ListarPlaylists (Vazio) returns (ListaPlaylists);
  rpc BuscarPlaylist (Id) returns (Playlist);
  rpc CriarPlaylist (PlaylistRequest) returns (Playlist);
  rpc AtualizarPlaylist (AtualizarPlaylistRequest) returns (Playlist);
  rpc ExcluirPlaylist (Id) returns (Vazio);

  // consultas pedidas no enunciado
  rpc PlaylistsDoUsuario (Id) returns (ListaPlaylists);
  rpc MusicasDaPlaylist (Id) returns (ListaMusicas);
  rpc PlaylistsDaMusica (Id) returns (ListaPlaylists);
}
